<!DOCTYPE html>                                                                                                                                                                                                                            
<html lang="en">                                                                                                                                                                                                                           
  <head>                                                                                                                                                                                                                                   
    <meta charset="utf-8" />                                                                                                                                                                                                               
    <meta name="viewport" content="width=device-width, initial-scale=1" />                                                                                                                                                                 
    <meta name="theme-color" content="#000000" />                                                                                                                                                                                          
    <meta name="description" content="Engineers Spark Training Platform - ISETCom" />
    <link rel="icon" type="image/png" href="/themes/CyberSpark/static/logo.png" />

    <title>Engineers Spark</title>
                                                                                                                                                                                                                                           
    <script>                                                                                                                                                                                                                               
      window.init = {                                                                                                                                                                                                                      
        urlRoot: "{{ request.script_root }}",                                                                                                                                                                                              
        csrfNonce: "{{ Session.nonce }}",                                                                                                                                                                                                  
        userMode: "{{ Configs.user_mode }}",                                                                                                                                                                                               
        userId: {{ Session.id or 'null' }},                                                                                                                                                                                                
        userName: "{{ Session.name or '' }}",                                                                                                                                                                                              
        userEmail: "{{ Session.email or '' }}",                                                                                                                                                                                            
        userType: "{{ Session.type or '' }}",                                                                                                                                                                                              
        challengeVisibility: "{{ Configs.challenge_visibility }}",                                                                                                                                                                         
        accountVisibility: "{{ Configs.account_visibility }}",                                                                                                                                                                             
        scoreVisibilityValue: "{{ Configs.score_visibility }}",                                                                                                                                                                            
        registrationVisibility: "{{ Configs.registration_visibility }}",                                                                                                                                                                   
        registrationCodeRequired: {{ 'true' if Configs.registration_code_required else 'false' }},                                                                                                                                         
        ctfStart: {% if Configs.start %}"{{ Configs.start }}"{% else %}null{% endif %},                                                                                                                                                    
        ctfEnd: {% if Configs.end %}"{{ Configs.end }}"{% else %}null{% endif %},                                                                                                                                                          
        ctfPaused: {{ 'true' if Configs.paused else 'false' }},                                                                                                                                                                            
        scoreVisibility: {{ 'true' if Configs.score_visibility != 'hidden' else 'false' }}                                                                                                                                                 
      };                                                                                                                                                                                                                                   
    </script>                                                                                                                                                                                                                              
                                                                                                                                                                                                                                           
    <link rel="stylesheet" href="/themes/CyberSpark/static/assets/index-C7pBmJ_r.css" />
  </head>                                                                                                                                                                                                                                  
  <body>                                                                                                                                                                                                                                   
    <div id="root"></div>                                                                                                                                                                                                                  
    <script type="module" src="/themes/CyberSpark/static/assets/index-BoioDGRv.js"></script>
  </body>                                                                                                                                                                                                                                  
</html>
